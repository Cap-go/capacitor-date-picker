<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@capgo/capacitor-date-picker Example</title>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="app-header">
        <img class="app-logo" src="/app-icon.svg" alt="" />
        <h1>@capgo/capacitor-date-picker</h1>
      </header>
      <p class="lead">Validate native and web date picker behavior.</p>

      <div class="actions">
        <button id="pick-date">Pick date</button>
        <button id="pick-time">Pick time</button>
        <button id="pick-range">Pick range</button>
        <button id="hide-picker">Hide picker</button>
        <button id="get-version">Get plugin version</button>
      </div>

      <pre id="plugin-output">Choose an action.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
